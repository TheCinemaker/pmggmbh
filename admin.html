<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Adminbereich</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <a href="index.html" class="home-button" title="Zurück zur Startseite" aria-label="Zurück zur Startseite">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8h5z"/>
        </svg>
      </a>

      <h1>Admin</h1>

      <div class="header-actions"> <!-- Konténer az esetleges jövőbeli gomboknak -->
        <button id="refreshBtn" class="icon-button" type="button" title="Aktualisieren" aria-label="Aktualisieren">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.1A6 6 0 1 1 12 6c1.3 0 2.5.42 3.45 1.13L13 10h7V3l-2.35 2.35Z"/>
          </svg>
          <span class="sr-only">Aktualisieren</span>
        </button>
        <button id="openAdminUpload" class="action-button">Data upload</button>
      </div>
    </header>

    <div id="lastUpdated" class="last-updated" aria-live="polite"></div>

    <main class="content" id="adminContent">
      
      <!-- QUICK STATS KPI BAR -->
      <div id="adminStatsBar" class="stats-bar">
        <div class="stat-card">
          <div class="stat-icon blue">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="statMitarbeiter">0</span>
            <span class="stat-label">Mitarbeiter</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="statFiles">0</span>
            <span class="stat-label">Dateien</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon red">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          </div>
          <div class="stat-info">
            <span class="stat-value" id="statKrank">0</span>
            <span class="stat-label">Krankenstand</span>
          </div>
        </div>
      </div>

      <!-- SZŰRŐK KONTÉNERE -->
      <div class="filters-container">
        <!-- MEGLÉVŐ NÉV-SZŰRŐ -->
        <div class="form-group search-input-group">
          <label for="nameFilter" class="sr-only">Nach Name filtern</label>
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="nameFilter" placeholder="Nach Name filtern…" />
        </div>

        <!-- ÚJ CÉG-SZŰRŐ -->
        <div class="form-group">
          <label for="companyFilter" class="sr-only">Nach Firma filtern</label>
          <select id="companyFilter" aria-label="Nach Firma filtern">
            <!-- JavaScript tölti fel -->
          </select>
        </div>

        <div class="form-group">
          <button id="weeklyReportBtn" class="action-button">Wochenbericht</button>
        </div>

         <div class="form-group toggle-group">
          <label for="autoUpdateToggle" class="toggle-label">Auto-Update:</label>
          <label class="switch">
            <input type="checkbox" id="autoUpdateToggle">
            <span class="slider round"></span>
          </label>
        </div>
      </div>

      <div id="filterResultsSummary" class="filter-results-summary"></div>

      <div id="userListContainer">
        <!-- Karten werden per JS gerendert -->
      </div>
    </main>
  </div>

  <!-- LIGHTBOX / KÉP ÉS DOKUMENTUM MEGTEKINTŐ MODÁL -->
  <div id="fileLightboxModal" class="lightbox-modal hidden">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <button id="closeLightboxBtn" class="lightbox-close" title="Schließen" aria-label="Schließen">✕</button>
      <div id="lightboxBody" class="lightbox-body">
        <!-- JS tölti fel -->
      </div>
    </div>
  </div>

  <script src="imageCompressor.js"></script>
  <script src="admin.js"></script>

    <button id="backToTopBtn" class="back-to-top" title="Nach oben">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
    </svg>
  </button>
  
</body>
</html>
